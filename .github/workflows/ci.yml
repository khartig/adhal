# CI, and specifically CI on the platforms this project actually targets.
#
# There was none before Stage 0. Every reliability number in the repo came
# from one developer's Mac talking to one developer's Linux box, and every
# claim about Windows was a claim about code nobody had run there. This
# file is the smallest thing that makes "it works on macOS and Linux" a
# checked fact rather than a recollection.
#
# THE MATRIX IS DELIBERATELY ASYMMETRIC.
#
#   macos-latest, ubuntu-24.04   REQUIRED. These are the primary targets
#                                (docs/IMPLEMENTATION-PLAN.md, Stage 3):
#                                they are where development happens and
#                                where the first release ships. Linux is
#                                pinned rather than `-latest` for the
#                                reason under ubuntu-26.04 below.
#
#   ubuntu-26.04                 ADVISORY, and temporary. The `ubuntu-latest`
#                                label starts migrating to Ubuntu 26 on
#                                2026-10-19 and finishes around 2026-11-19
#                                (actions/runner-images#14748), so the
#                                required Linux leg is pinned to 24.04
#                                rather than being moved underneath us
#                                mid-sprint -- this repo ships native
#                                prebuilds for the Holepunch stack, which
#                                is exactly the kind of dependency an OS
#                                and glibc bump disturbs. This leg runs the
#                                new image early so the breakage, if any,
#                                is known before the migration rather than
#                                during it. Once it has been green for a
#                                while, promote 26.04 to the required leg
#                                and delete this one.
#
#   windows-latest               ADVISORY, via continue-on-error. Windows
#                                is the third platform, not the first, and
#                                real failures are expected there right
#                                now -- `fs.rename`/`link` semantics over
#                                an open file, `:` being illegal in a name,
#                                MAX_PATH, and native prebuilds for the
#                                Holepunch stack. Making it required today
#                                would mean either a permanently red board
#                                or a rushed fix on the platform we have
#                                the least evidence about. It runs so the
#                                gap is measured instead of guessed, and it
#                                becomes required when Stage 3 reaches it.
#
#                                Signals are no longer on that list.
#                                Console Ctrl+C arrives as SIGINT on
#                                Windows and always did; SIGBREAK is
#                                handled now; SIGTERM cannot fire there
#                                and is inert rather than broken. The one
#                                thing still unproven is whether the two
#                                end-to-end cancel tests can reach the CLI
#                                with a real CTRL_C_EVENT, which needs the
#                                child to be alone in its console. They
#                                measure that and skip with the reason
#                                when it does not hold, rather than fail.
#
# ACTION VERSIONS ARE PINNED TO MAJORS THAT RUN ON NODE 24. The v4 line of
# checkout/setup-node/pnpm-action-setup targets the Node 20 runtime, which
# the runner now force-upgrades while printing a deprecation warning on
# every job. checkout v5, setup-node v5 and pnpm/action-setup v5 are the
# first majors on node24, so anything older warns. Two behavior changes
# came along for the ride and neither affects this workflow: setup-node v5
# started caching automatically when package.json has a `packageManager`
# field and v6 narrowed that to npm only -- `cache: pnpm` below is explicit
# either way -- and checkout v7 refuses to check out fork PRs for
# `pull_request_target`/`workflow_run`, neither of which triggers this file.
#
# The failure this file is most likely to catch is not a logic bug. It is
# a platform assumption written on a Mac -- which is exactly the class of
# bug the name-policy and publish() work in Stage 0 is full of.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback, on one OS, so an obvious break is reported in under a
  # minute instead of waiting on the full network suite everywhere.
  lint-and-types:
    name: types
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The repo is JSDoc-typechecked rather than TypeScript-authored, so
      # this is the only thing standing between a wrong @param and nobody
      # noticing.
      - run: pnpm typecheck

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Windows and the next Ubuntu image are allowed to fail; the two
    # primary platforms are not.
    continue-on-error: ${{ matrix.advisory }}
    strategy:
      # Do not let one OS failing hide the result on the others -- the
      # whole point of the matrix is comparing them.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            advisory: false
          - os: macos-latest
            advisory: false
          - os: windows-latest
            advisory: true
          - os: ubuntu-26.04
            advisory: true
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      # Node 24, not 22. On 22.x the six stall-timer and size-cap tests in
      # cli/test/hardening.test.js are reported cancelled -- "Promise
      # resolution is still pending but the event loop has already
      # resolved" -- on every run, here and locally on 22.23.2. They pass
      # on 24.21.0 on every run. 24 is also the version the protocol was
      # written against (docs/PROTOCOL.md), so it is what should be under
      # test rather than a version nothing is developed on.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The sub-10s tier first. It needs no network and no DHT, so when it
      # fails the full run below is not worth waiting for.
      #
      # The variable is set here rather than run via the `test:fast`
      # script, because `ADHAL_FAST=1 pnpm ...` is POSIX shell syntax and
      # this job also runs on Windows under pwsh. Actions' `env:` is the
      # one form all three runners agree on.
      - name: fast tier
        run: pnpm test
        env:
          ADHAL_FAST: '1'

      # The full suite, including the hyperdht testnet tests. These spin up
      # real DHT nodes on loopback; they are the slow part and the reason
      # the fast tier exists.
      - name: full suite
        run: pnpm test
        timeout-minutes: 15

  # Dependency hygiene, advisory for now: this stack pulls in a large
  # Holepunch tree and a first run that fails the build on a transitive
  # advisory with no fix available would just get disabled. Reported, read,
  # and tightened once there is a baseline.
  audit:
    name: audit (advisory)
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level moderate
      # A lockfile that changes when nobody changed a dependency is worth
      # seeing, and --frozen-lockfile above already fails on it. This just
      # prints what is installed so a review has something to read.
      - run: pnpm licenses list || true
